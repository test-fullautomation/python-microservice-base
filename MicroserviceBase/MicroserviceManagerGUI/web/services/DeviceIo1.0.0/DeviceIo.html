<!--
  Service-provided GUI for the Device I/O service (AI / AO / DI / DO).
  Legacy panel (DeviceIo.html + DeviceIo.js, no component.json): the Manager GUI
  renders it inside the host page, so Bootstrap 5 + bi-* icons come from the host.
  The companion DeviceIo.js talks to the service through MM.grpcClient (reflection).
-->
<div class="p-3" id="dioGui">
  <style>
    #dioGui input[type=number]::-webkit-inner-spin-button { margin-left: 8px; }
    #dioGui .dio-card {
      border: 1px solid #dee2e6;
      border-radius: 10px;
      padding: 14px 16px;
      background: #fff;
      height: 100%;
    }

    #dioGui .dio-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    #dioGui .dio-pill.hi {
      background: #d1e7dd;
      color: #0f5132;
    }

    #dioGui .dio-pill.lo {
      background: #e2e3e5;
      color: #41464b;
    }

    #dioGui table.dio-tbl {
      font-size: 0.85rem;
      table-layout: fixed;
      width: 100%;
    }

    #dioGui table.dio-tbl td,
    #dioGui table.dio-tbl th {
      padding: 4px 8px;
      vertical-align: middle;
      height: 38px;
    }

    #dioGui .dio-val {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
  </style>

  <div class="row g-3">
    <!-- header -->
    <div class="col-12 d-flex justify-content-between align-items-center mb-1">
      <div class="text-muted small fw-bold"><i class="bi bi-cpu me-1"></i>Device I/O Channels</div>
      <div class="small fw-bold text-secondary" id="dioTarget">…</div>
    </div>
    <div class="col-12 text-muted small mt-0 mb-1" id="dioHint">Reading channels from the service…</div>
    <!-- Analog inputs -->
    <div class="col-md-6 d-none" id="dioCardAi">
      <div class="dio-card">
        <div class="text-muted small mb-2 fw-bold"><i class="bi bi-speedometer2 me-1"></i>Analog Inputs</div>
        <table class="table table-sm table-hover dio-tbl mb-0">
          <thead>
            <tr>
              <th style="width:160px">Channel</th>
              <th class="text-end">Value</th>
            </tr>
          </thead>
          <tbody id="dioAiRows">
            <tr>
              <td colspan="2" class="text-muted">—</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Analog outputs -->
    <div class="col-md-6 d-none" id="dioCardAo">
      <div class="dio-card">
        <div class="text-muted small mb-2 fw-bold"><i class="bi bi-sliders me-1"></i>Analog Outputs</div>
        <table class="table table-sm table-hover dio-tbl mb-0">
          <thead>
            <tr>
              <th style="width:160px">Channel</th>
              <th class="text-end">Current Value</th>
            </tr>
          </thead>
          <tbody id="dioAoRows">
            <tr>
              <td colspan="2" class="text-muted">—</td>
            </tr>
          </tbody>
        </table>

        <table class="table table-sm dio-tbl mb-0 mt-2">
          <thead>
            <tr>
              <th style="width:160px" class="border-top-0 pt-3">Channel</th>
              <th class="text-end border-top-0 pt-3"></th>
              <th style="width:55px" class="border-top-0 pt-3"></th>
            </tr>
          </thead>
          <tbody id="dioAoControls">
          </tbody>
        </table>
      </div>
    </div>

    <!-- Digital inputs -->
    <div class="col-md-6 d-none" id="dioCardDi">
      <div class="dio-card">
        <div class="text-muted small mb-2 fw-bold"><i class="bi bi-box-arrow-in-right me-1"></i>Digital Inputs</div>
        <table class="table table-sm table-hover dio-tbl mb-0">
          <thead>
            <tr>
              <th style="width:160px">Channel</th>
              <th class="text-end"><div class="d-inline-block text-center" style="width: 75px;">State</div></th>
            </tr>
          </thead>
          <tbody id="dioDiRows">
            <tr>
              <td colspan="2" class="text-muted">—</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Digital outputs -->
    <div class="col-md-6 d-none" id="dioCardDo">
      <div class="dio-card">
        <div class="text-muted small mb-2 fw-bold"><i class="bi bi-toggle-on me-1"></i>Digital Outputs</div>
        <table class="table table-sm table-hover dio-tbl mb-0">
          <thead>
            <tr>
              <th style="width:160px">Channel</th>
              <th class="text-end"><div class="d-inline-block text-center" style="width: 75px;">State</div></th>
            </tr>
          </thead>
          <tbody id="dioDoRows">
            <tr>
              <td colspan="2" class="text-muted">—</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="dioError" class="alert alert-danger py-2 small mt-3 mb-0 d-none"></div>
</div>
