[build-system]
requires = ["setuptools>=45", "wheel", "colorama>=0.4.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MicroserviceBase"
version = "2.1.0"
description = "Microservice base framework with pluggable transport, registry adapters, and Manager GUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    { name = "Nguyen Huynh Tri Cuong", email = "Cuong.NguyenHuynhTri@vn.bosch.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["microservice", "grpc", "consul", "nomad", "registry", "rpc"]

dependencies = [
    "grpcio>=1.60.0",
    "grpcio-reflection>=1.60.0",
    "grpcio-health-checking>=1.60.0",
    # grpcio-tools is needed at runtime by the bridge's "Pre-generate
    # proto stubs" feature (Service Creator wizard) — `from grpc_tools
    # import protoc` runs in-process when the user ticks that checkbox.
    # Was previously an optional `proto-tools` extra; promoted to a base
    # dep in 2026-05 because the wizard silently no-op'd when the bridge
    # Python lacked it.  ~30 MB cost on every install, but removes a
    # surprising failure mode.
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.10.0",
    "colorama>=0.4.0",
]
all = [
    "MicroserviceBase[web,dev]",
]

[project.urls]
Homepage = "https://github.com/test-fullautomation/python-microservice-base"
Documentation = "https://github.com/test-fullautomation/python-microservice-base#readme"
Repository = "https://github.com/test-fullautomation/python-microservice-base.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["MicroserviceBase*"]

[tool.setuptools.package-data]
# Scaffold generator reads template files at runtime from
# `MicroserviceBase/adapters/scaffold/templates/`.  Without this glob
# setuptools would only ship .py files in the wheel, causing the
# generator to fail with FileNotFoundError on installed copies.
"MicroserviceBase.adapters.scaffold" = ["templates/**/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["pytest"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
