[build-system]
requires = ["setuptools>=45", "wheel", "colorama>=0.4.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MicroserviceBase"
version = "2.2.0"
description = "Microservice base framework with pluggable transport, registry adapters, and Manager GUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    { name = "Nguyen Huynh Tri Cuong", email = "Cuong.NguyenHuynhTri@vn.bosch.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["microservice", "grpc", "consul", "nomad", "registry", "rpc"]

dependencies = [
    # ---------------------------------------------------------------
    # TEMPORARY PIN — grpc stack held at 1.48.x for protobuf 3.20.x
    # ---------------------------------------------------------------
    # Another library in the RobotFramework AIO installer requires
    # protobuf 3.20, and the AIO offline wheelhouse installs everything
    # into one environment. grpcio-tools 1.49+ requires protobuf
    # >=4.21.3, so 1.48.2 is the last release that can coexist with
    # protobuf 3.x:
    #
    #   grpcio-tools 1.48.2 -> protobuf >=3.12.0,<4.0dev   (OK)
    #   grpcio-tools 1.49.1 -> protobuf >=4.21.3,<5.0dev   (conflict)
    #
    # Safe for this codebase: MicroserviceBase only uses protobuf APIs
    # available in 3.20 (descriptor, descriptor_pool, symbol_database,
    # internal.builder, json_format) and long-stable gRPC APIs
    # (insecure_channel, *_rpc_method_handler, grpc_reflection.v1alpha).
    # `_msg_to_dict` already falls back from
    # always_print_fields_with_no_presence to
    # including_default_value_fields, which is the correct kwarg on 3.x.
    #
    # The pin is gated on python_version because grpcio 1.48.2 publishes
    # NO wheels for Python 3.11+ on any platform (highest tag is cp310).
    # A flat pin would force a source build of 3-year-old C++ on modern
    # interpreters and break local development.
    #
    #   Python <= 3.10  -> AIO target (config/CRepositoryConfig.py hardcodes
    #                      lib/python3.10): old stack, protobuf 3.20.x
    #   Python >= 3.11  -> developer machines (e.g. %RobotPythonPath%,
    #                      currently 3.13): current stack, protobuf 4.25+
    #
    # REVERT: once the other AIO component moves off protobuf 3.20, drop
    # the markers and keep only the >=3.11 line for every interpreter.
    #
    # grpcio-tools is a RUNTIME dep, not just build-time: the bridge's
    # "Pre-generate proto stubs" feature and the Robot resource generator
    # both run `python -m grpc_tools.protoc`.
    "grpcio>=1.48,<1.49 ; python_version < '3.11'",
    "grpcio-reflection>=1.48,<1.49 ; python_version < '3.11'",
    "grpcio-health-checking>=1.48,<1.49 ; python_version < '3.11'",
    "grpcio-tools>=1.48,<1.49 ; python_version < '3.11'",
    "protobuf>=3.20,<4 ; python_version < '3.11'",

    "grpcio>=1.60.0 ; python_version >= '3.11'",
    "grpcio-reflection>=1.60.0 ; python_version >= '3.11'",
    "grpcio-health-checking>=1.60.0 ; python_version >= '3.11'",
    "grpcio-tools>=1.60.0 ; python_version >= '3.11'",
    "protobuf>=4.25.0 ; python_version >= '3.11'",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.10.0",
    "colorama>=0.4.0",
]
all = [
    "MicroserviceBase[web,dev]",
]

[project.urls]
Homepage = "https://github.com/test-fullautomation/python-microservice-base"
Documentation = "https://github.com/test-fullautomation/python-microservice-base#readme"
Repository = "https://github.com/test-fullautomation/python-microservice-base.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["MicroserviceBase*"]

[tool.setuptools.package-data]
# Scaffold generator reads template files at runtime from
# `MicroserviceBase/adapters/scaffold/templates/`.  Without this glob
# setuptools would only ship .py files in the wheel, causing the
# generator to fail with FileNotFoundError on installed copies.
"MicroserviceBase.adapters.scaffold" = ["templates/**/*.tmpl"]

[tool.pytest.ini_options]
# Both suites run by default.  Keeping only "pytest" here meant a bare
# `pytest` invocation exercised ONLY the legacy RabbitMQ/AMQP unit tests
# and silently skipped every test covering the current gRPC + Consul +
# Nomad + scaffold-generator architecture -- so CI could report green
# while testing none of the migration.
#
#   pytest/                     legacy transport/registry unit tests.
#                               Still valid: the RabbitMQ adapters were
#                               superseded by gRPC (ADR-028), not deleted.
#   test/pytest/pytestfiles/    current architecture: scaffold generator,
#                               gRPC reflection, Consul registration,
#                               Robot resource generator (MSB_0001-0021).
testpaths = ["pytest", "test/pytest/pytestfiles"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
