[project]
name = "hello_service"
version = "0.1.0"
description = "Minimal demo microservice for the new MicroserviceBase runtime"
requires-python = ">=3.10"

dependencies = [
    "MicroserviceBase",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "grpcio-reflection>=1.60.0",
    "grpcio-health-checking>=1.60.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[tool.setuptools]
py-modules = ["main", "config", "context"]
