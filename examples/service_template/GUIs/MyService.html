<div class="card" style="height: 100%; width: 100%; top: 0;">
   <div class="card-header">
      <h5 class="card-title">MyService</h5>
   </div>
   <div class="card-body">
      <p>Replace this with your custom GUI.</p>

      <div class="mb-3">
         <label for="inputName" class="form-label">Name</label>
         <input type="text" class="form-control" id="inputName" placeholder="World">
      </div>
      <button class="btn btn-primary" id="btnHello" onclick="callHello()">Say Hello</button>

      <div id="resultArea" class="mt-3" style="display: none;">
         <div class="alert alert-info" id="resultText"></div>
      </div>
   </div>
</div>
