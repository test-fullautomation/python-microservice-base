# ProperDocs configuration for the MicroserviceBase framework docs.
#
# Build:  "C:\Program Files\RobotFramework\python3\python.exe" -m properdocs build --clean
# Serve:  "C:\Program Files\RobotFramework\python3\python.exe" -m properdocs serve
#
# PlantUML renders through the VENDORED jar at tools/plantuml.jar (no
# plantuml.com round-trip), so the build works behind the corporate proxy.
# Graphviz 2.44.1 is installed and detected, so graph diagrams (class /
# component / state) render with dot; no Smetana pragma is required.

site_name: MicroserviceBase
site_description: Hexagonal microservice framework - gRPC, Consul, Nomad
site_author: BITS Test Automation Solutions
repo_url: https://github.com/test-fullautomation/python-microservice-base
repo_name: python-microservice-base
edit_uri: edit/develop/docs/

docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  navigation_depth: 3
  highlightjs: true

extra_css:
  - css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - fenced_code
  - codehilite:
      guess_lang: false
  # NOTE: no quotes around the jar path - plantuml-markdown passes the
  # string to java verbatim, and quotes would be taken literally.
  - plantuml_markdown:
      plantuml_cmd: java -Dplantuml.include.path=docs -jar tools/plantuml.jar
      base_dir: docs
      format: svg

plugins:
  # A plugins: block REPLACES the defaults, so search must be re-listed.
  - search
  - glightbox:
      zoomable: true
      draggable: true

# Manager GUI docs and examples docs cannot be moved into docs/ -- their
# HTML twins are shipped runtime assets (in-app help + Electron bundle),
# and examples/docs/ ships in the installer. The hook copies their
# Markdown into docs/gui/ and docs/examples/ at build time and rewrites
# the links. Both destinations are gitignored build artefacts.
hooks:
  - docs_hooks/copy_external_docs.py

# Live-reload when the CANONICAL sources of the generated trees change,
# so editing a GUI or examples page still refreshes the browser.
#
# (There is no `watch_ignore` option in MkDocs/ProperDocs -- setting one
# aborts a --strict build. The hook writing into docs/ does not cause a
# rebuild loop because it writes byte-identical content each time, so the
# file watcher sees no modification after the first pass.)
watch:
  - docs_hooks
  - MicroserviceBase/MicroserviceManagerGUI/docs/md
  - examples/docs/md

# docs/_legacy/ holds pre-migration (RabbitMQ-era) material kept for
# historical reference only. It is excluded from the build entirely --
# its links point at diagrams that have since moved to diagrams/_archive/,
# and publishing superseded architecture alongside the current one is
# actively misleading. The files remain in git; see ADR-028 for what
# replaced them.
exclude_docs: |
  _legacy/

# Kept in the build but deliberately out of the sidebar: the .puml sources
# are embedded into architecture/diagrams.md rather than served as pages.
not_in_nav: |
  diagrams/**

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Concepts: architecture/concepts.md
      - Runtime model: architecture/runtime-model.md
      - Diagrams: architecture/diagrams.md
  - Guides:
      - "C++ runtime install": guides/runtime-cpp-install.md
  # --- generated at build time by docs_hooks/copy_external_docs.py ---
  - Manager GUI:
      - Overview: gui/index.md
      - Service Creator wizard: gui/service_creator.md
      - Robot resource generator: gui/robot_generator.md
      - "Operating Consul + Nomad": gui/ops_consul_nomad.md
  - Examples and toolchain:
      - Overview: examples/index.md
      - Creating a service: examples/service_creation.md
      - MinGW setup: examples/mingw_setup.md
      - vcpkg setup: examples/vcpkg_setup.md
      - "Qt + gRPC setup": examples/qt_grpc_setup.md
      - WASM Cleware service: examples/wasm_cleware_service_guide.md
  # -------------------------------------------------------------------
  - Reference:
      - Troubleshooting: reference/troubleshooting.md
