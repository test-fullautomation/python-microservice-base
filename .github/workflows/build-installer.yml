name: Build DevAtServGUI installers

# Builds the Windows and Linux installers whenever a PR lands on develop
# (a merged PR is a push to develop), and on demand via the Actions tab.
#
# Two runners are required -- electron-builder cannot cross-build these:
#   windows-latest -> NSIS .exe
#   ubuntu-latest  -> AppImage + .deb

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      msb_ref:
        description: 'Ref of the MicroserviceBase repo to build the bundled wheel from'
        default: 'develop'

permissions:
  contents: read
  actions: write
concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The version guard runs once, on Linux, before either installer is
  # built -- no point burning two runners on a mismatch.
  #
  # installer.nsh hard-codes the wheel filenames it installs (MSB_VER,
  # BRIDGE_VER). When MSB_VER drifted from the wheel, the installer could
  # not find its bundled wheel, silently fell back to PyPI, and shipped
  # 2.1.0 while the wheel was 2.2.0. build-resources/fetch_wheels.py
  # checks both wheels; this job checks the bridge and the app version
  # before any runner builds.
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: bridge/pyproject.toml and installer.nsh must agree; package.json has one version
        run: |
          # sed everywhere, for two reasons:
          #  - `grep -oP` needs PCRE, which is unavailable in some locales
          #    and on non-GNU grep, and would fail silently.
          #  - reading package.json with `node` would make this job depend
          #    on a Node toolchain it otherwise has no use for. The build
          #    job pins Node 20; this one would have picked up whatever
          #    the runner image happened to ship.
          proj=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' bridge/pyproject.toml | head -1)
          nsh=$(sed -n 's/.*!define[[:space:]]\{1,\}BRIDGE_VER[[:space:]]\{1,\}"\([^"]*\)".*/\1/p' build-resources/installer.nsh | head -1)

          # No JSON parser here, so make the assumption explicit: bail out
          # if "version" is not unique rather than silently taking the
          # first match (which a nested key could shadow after a refactor).
          pkg_hits=$(grep -c '"version"[[:space:]]*:' package.json)
          if [ "$pkg_hits" -ne 1 ]; then
            echo "::error::Expected exactly one \"version\" key in package.json, found $pkg_hits."
            echo "::error::Disambiguate it, or switch this step to a real JSON parser."
            grep -n '"version"[[:space:]]*:' package.json
            exit 1
          fi
          pkg=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)

          echo "bridge/pyproject.toml : $proj"
          echo "installer.nsh         : $nsh"
          echo "package.json          : $pkg"

          if [ -z "$proj" ] || [ -z "$nsh" ] || [ -z "$pkg" ]; then
            echo "::error::Could not read one of the versions"; exit 1
          fi
          if [ "$proj" != "$nsh" ]; then
            echo "::error::Version mismatch - the installer would bundle a bridge wheel it cannot find"
            exit 1
          fi
          echo "OK - bridge $proj, app $pkg"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

  build:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            builder_flags: '--win --x64'
            artifact_glob: |
              dist/*.exe
              dist/*.exe.blockmap
          - os: ubuntu-latest
            name: linux
            builder_flags: '--linux'
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MicroserviceBase is built from its own repo, at the ref the run
      # asks for, until the installers pin a released version.
      - name: Checkout MicroserviceBase
        uses: actions/checkout@v4
        with:
          repository: test-fullautomation/python-microservice-base
          ref: ${{ inputs.msb_ref || 'develop' }}
          path: _msb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # electron-builder's .deb target shells out to dpkg/fakeroot, which
      # are not all present on a bare ubuntu runner.
      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm

      - name: Install npm dependencies
        run: npm ci

      # fetch_wheels.py fails when a wheel is missing or its version is
      # not the one installer.nsh installs.
      - name: Build the MicroserviceBase and bridge wheels
        shell: bash
        env:
          MSB_SRC: _msb
        run: |
          python -m pip install --upgrade pip wheel setuptools colorama
          python build-resources/fetch_wheels.py

      - name: Build installer (${{ matrix.name }})
        run: npx electron-builder ${{ matrix.builder_flags }}

      # Only the installers themselves. electron-builder also drops an
      # ~84 MB .zip and debug yml into dist/; uploading those would
      # roughly double the artifact for no benefit.
      - name: Upload ${{ matrix.name }} installer
        uses: actions/upload-artifact@v4
        with:
          name: DevAtServGUI-${{ matrix.name }}-${{ needs.version-check.outputs.version }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo "## ${{ matrix.name }} installer"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/*.exe dist/*.AppImage dist/*.deb; do
              [ -f "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo ""
            echo "Version \`${{ needs.version-check.outputs.version }}\` · commit \`${GITHUB_SHA:0:8}\`"
          } >> "$GITHUB_STEP_SUMMARY"
